# Local stack: db, migrate, seed, backend, web. `make up` wraps this.
# Runs offline once images are built. No-Docker alternative: scripts/dev.sh.

x-backend: &backend
  image: jobproof-backend
  build:
    context: ./backend
  env_file:
    - path: .env
      required: false

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobproof}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobproof}
      POSTGRES_DB: ${POSTGRES_DB:-jobproof}
    ports:
      - "5544:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobproof"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  seed:
    <<: *backend
    command: ["python", "-m", "app.seed"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  backend:
    <<: *backend
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --timeout-graceful-shutdown
      - "20"
    depends_on:
      seed:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    stop_grace_period: 30s
    restart: unless-stopped

  web:
    image: jobproof-web
    build:
      context: .
      dockerfile: web/Dockerfile
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://localhost:8000}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
