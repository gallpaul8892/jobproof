# Local stack: db, migrate, seed, backend, web. `make up` wraps this.
# Runs offline once images are built. No-Docker alternative: scripts/dev.sh.

x-backend: &backend
  image: jobproof-backend
  build:
    context: ./backend
  env_file:
    - path: .env
      required: false
  # APP_ENV has no default in the backend, and the .env above is optional, so a fresh clone
  # running `docker compose up` directly would start the seed without it. This keeps the local
  # stack working (interpolated from .env or the shell, else local) and overrides env_file.
  environment:
    APP_ENV: ${APP_ENV:-local}
    # Photo storage (T-003g): the SeaweedFS service below. The backend talks to it as `photos`;
    # presigned links are signed for localhost, which is where browsers and phones reach it.
    # The keys are dummies (SeaweedFS here has no identities, so any key is accepted).
    PHOTO_BUCKET: ${PHOTO_BUCKET:-jobproof-local-photos}
    PHOTO_S3_ENDPOINT_URL: http://photos:8333
    PHOTO_S3_PUBLIC_ENDPOINT_URL: ${PHOTO_PUBLIC_ORIGIN:-http://localhost:8333}
    PHOTO_S3_ADDRESSING_STYLE: path
    AWS_ACCESS_KEY_ID: local-dev-key
    AWS_SECRET_ACCESS_KEY: local-dev-secret

services:
  db:
    # TODO(pin): floating tag. Pin the exact tag/digest on a machine with registry access.
    image: postgres:19-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobproof}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobproof}
      POSTGRES_DB: ${POSTGRES_DB:-jobproof}
    ports:
      - "5544:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  photos:
    # S3-compatible private object store for uploaded photos (T-003g). MinIO's community images
    # are discontinued and LocalStack needs an account; SeaweedFS runs offline.
    # TODO(pin): floating tag (B3). Pin the exact tag/digest on a machine with registry access.
    image: chrislusf/seaweedfs
    command: ["server", "-s3", "-dir=/data"]
    ports:
      - "8333:8333"
    volumes:
      - photosdata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9333/cluster/status || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  photos-init:
    <<: *backend
    # Creates the bucket (same settings as the backend; refuses to run outside local/test).
    command: ["python", "-m", "app.photos.create_bucket"]
    depends_on:
      photos:
        condition: service_healthy
    restart: "no"

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  seed:
    <<: *backend
    command: ["python", "-m", "app.seed"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  backend:
    <<: *backend
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --timeout-graceful-shutdown
      - "20"
    depends_on:
      seed:
        condition: service_completed_successfully
      photos-init:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    stop_grace_period: 30s
    restart: unless-stopped

  web:
    image: jobproof-web
    build:
      context: .
      dockerfile: web/Dockerfile
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://localhost:8000}
      # Where the browser loads uploaded photos from (CSP img-src): the photos service.
      PHOTO_ORIGIN: ${PHOTO_PUBLIC_ORIGIN:-http://localhost:8333}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  photosdata:
