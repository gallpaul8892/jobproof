# Push to main: ci, then build once, then (when AWS is set up) Terraform apply and deploy to dev,
# then a Terraform plan for prod. Spec: specs/INFRA-aws-pipeline.md section 4.3.
#
# AWS jobs (terraform-dev, deploy-dev, prod-preview) are skipped while the repository variable
# AWS_DEV_ACCOUNT_ID (and AWS_PROD_ACCOUNT_ID for prod-preview) is empty, so the workflow is green
# and useful (ci and the build) before the AWS bootstrap.
#
# Concurrency: only terraform-dev and deploy-dev use the deploy-dev group (a workflow-level group
# would let a newer push replace a queued older run before it even got CI).
#
# The AWS jobs are written out in this file and not in a reusable workflow, because the AWS trust
# policy names this workflow file (job_workflow_ref). Do not add `environment:` to a job: it would
# change the OIDC subject and break that trust.
name: pipeline

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  AWS_REGION: eu-west-2
  NODE_VERSION: "22"

jobs:
  ci:
    name: ci
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: build (backend image, web bundle; once)
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the backend image, tagged with the commit SHA
        run: |
          docker build --pull \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --tag "jobproof-backend:$GITHUB_SHA" backend
          docker save "jobproof-backend:$GITHUB_SHA" | gzip -1 > "$RUNNER_TEMP/backend-image.tar.gz"
          ls -l "$RUNNER_TEMP/backend-image.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-image
          path: ${{ runner.temp }}/backend-image.tar.gz
          compression-level: 0
          retention-days: 90
          if-no-files-found: error
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Build the web bundle (includes the bundle origin check)
        run: npm run build -w @jobproof/web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: web/dist
          retention-days: 90
          if-no-files-found: error

  terraform-dev:
    name: terraform apply (dev)
    needs: build
    if: vars.AWS_DEV_ACCOUNT_ID != ''
    concurrency:
      group: deploy-dev # one dev deploy at a time; a running deploy is never cancelled
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write # only to assume the dev Terraform role
    outputs:
      tf: ${{ steps.outputs.outputs.json }}
    env:
      ACCOUNT_ID: ${{ vars.AWS_DEV_ACCOUNT_ID }}
      PEER_ACCOUNT_ID: ${{ vars.AWS_PROD_ACCOUNT_ID }} # empty until prod is bootstrapped
      TF_IN_AUTOMATION: "1"
      TF_INPUT: "0"
    defaults:
      run:
        working-directory: infra/terraform/envs/dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the account id
        run: |
          [[ "$ACCOUNT_ID" =~ ^[0-9]{12}$ ]] || { echo "::error::AWS_DEV_ACCOUNT_ID must be 12 digits"; exit 1; }
          if [ -n "$PEER_ACCOUNT_ID" ] && ! [[ "$PEER_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]; then
            echo "::error::AWS_PROD_ACCOUNT_ID must be 12 digits"; exit 1
          fi
      - uses: ./.github/actions/setup-terraform
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_DEV_ACCOUNT_ID }}:role/jobproof-github-terraform
          role-session-name: pipeline-dev-terraform
          aws-region: ${{ env.AWS_REGION }}
      - name: terraform init (state bucket of the dev account)
        run: |
          lock=()
          if [ -f .terraform.lock.hcl ]; then lock=(-lockfile=readonly); fi
          terraform init "${lock[@]}" -backend-config="bucket=jobproof-tfstate-$ACCOUNT_ID"
      - name: First run only. Create the ECR repository (the one documented use of -target)
        id: ecr
        env:
          TF_VAR_image_tag: ${{ github.sha }}
        run: |
          set -euo pipefail
          if err="$(aws ecr describe-repositories --repository-names jobproof-backend 2>&1 >/dev/null)"; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$err" in
            *RepositoryNotFoundException*) ;;
            *) echo "$err" >&2; exit 1 ;;
          esac
          terraform apply -auto-approve -target=module.ecr \
            -var "allowed_account_ids=[\"$ACCOUNT_ID\"]"
          echo "created=true" >> "$GITHUB_OUTPUT"
      - name: First run only. Fetch the image so the service finds it when it is created
        if: steps.ecr.outputs.created == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: backend-image
          path: ${{ runner.temp }}/image
      - name: First run only. Push the image (the deploy role does not exist yet)
        if: steps.ecr.outputs.created == 'true'
        working-directory: .
        env:
          IMAGE_TAR: ${{ runner.temp }}/image/backend-image.tar.gz
          LOCAL_IMAGE: jobproof-backend:${{ github.sha }}
          TAG: ${{ github.sha }}
        run: |
          REPOSITORY_URL="$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/jobproof-backend" \
            infra/scripts/push-image.sh
      - name: terraform plan
        env:
          TF_VAR_image_tag: ${{ github.sha }}
          TF_VAR_allowed_account_ids: '["${{ vars.AWS_DEV_ACCOUNT_ID }}"]'
        run: |
          # promotion_peer_account_id is only passed once prod exists (it lets prod pull from dev).
          peer=()
          if [ -n "$PEER_ACCOUNT_ID" ]; then peer=(-var "promotion_peer_account_id=$PEER_ACCOUNT_ID"); fi
          terraform plan -out=tfplan -no-color "${peer[@]}"
      - name: terraform apply (new task-definition revisions; the service does not move yet)
        env:
          TF_VAR_image_tag: ${{ github.sha }}
          TF_VAR_allowed_account_ids: '["${{ vars.AWS_DEV_ACCOUNT_ID }}"]'
        run: terraform apply -no-color tfplan
      - name: Record the outputs for the deploy job
        id: outputs
        run: |
          set -euo pipefail
          terraform output -json | jq -c 'map_values(.value)' > "$RUNNER_TEMP/tf-outputs.json"
          echo "json=$(cat "$RUNNER_TEMP/tf-outputs.json")" >> "$GITHUB_OUTPUT"

  deploy-dev:
    name: deploy-dev
    needs: [build, terraform-dev]
    if: vars.AWS_DEV_ACCOUNT_ID != ''
    concurrency:
      group: deploy-dev # one dev deploy at a time; a running deploy is never cancelled
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write # only to assume the dev deploy role
    env:
      ACCOUNT_ID: ${{ vars.AWS_DEV_ACCOUNT_ID }}
      TF_OUTPUTS: ${{ needs.terraform-dev.outputs.tf }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the account id and keep the Terraform outputs
        run: |
          [[ "$ACCOUNT_ID" =~ ^[0-9]{12}$ ]] || { echo "::error::AWS_DEV_ACCOUNT_ID must be 12 digits"; exit 1; }
          printf '%s' "$TF_OUTPUTS" > "$RUNNER_TEMP/tf-outputs.json"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_DEV_ACCOUNT_ID }}:role/jobproof-github-deploy
          role-session-name: pipeline-dev-deploy
          aws-region: ${{ env.AWS_REGION }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: backend-image
          path: ${{ runner.temp }}/image
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: ${{ runner.temp }}/web-dist
      - name: Push the image to dev ECR (skipped when the tag is already there)
        id: push
        env:
          IMAGE_TAR: ${{ runner.temp }}/image/backend-image.tar.gz
          LOCAL_IMAGE: jobproof-backend:${{ github.sha }}
          TAG: ${{ github.sha }}
        run: |
          REPOSITORY_URL="$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/jobproof-backend" \
            infra/scripts/push-image.sh
      - name: Deploy (db-roles, migrate, seed-demo --if-empty, service, web, release, smoke test)
        uses: ./.github/actions/deploy-release
        with:
          environment: dev
          version: ${{ github.sha }}
          outputs-file: ${{ runner.temp }}/tf-outputs.json
          web-dist: ${{ runner.temp }}/web-dist
          seed-demo: "true"
      - name: Summary
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo
            echo "Image digest: \`$IMAGE_DIGEST\`"
            echo
            echo "To put this version in prod: Actions, **Deploy to prod**, **Run workflow**, version = \`$GITHUB_SHA\`."
          } >> "$GITHUB_STEP_SUMMARY"

  prod-preview:
    name: prod-preview (terraform plan, read-only)
    needs: deploy-dev
    if: vars.AWS_PROD_ACCOUNT_ID != '' && vars.AWS_DEV_ACCOUNT_ID != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # only to assume the prod read-only plan role
    env:
      ACCOUNT_ID: ${{ vars.AWS_PROD_ACCOUNT_ID }}
      PEER_ACCOUNT_ID: ${{ vars.AWS_DEV_ACCOUNT_ID }}
      TF_IN_AUTOMATION: "1"
      TF_INPUT: "0"
    defaults:
      run:
        working-directory: infra/terraform/envs/prod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the account ids
        run: |
          [[ "$ACCOUNT_ID" =~ ^[0-9]{12}$ ]] || { echo "::error::AWS_PROD_ACCOUNT_ID must be 12 digits"; exit 1; }
          [[ "$PEER_ACCOUNT_ID" =~ ^[0-9]{12}$ ]] || { echo "::error::AWS_DEV_ACCOUNT_ID must be 12 digits"; exit 1; }
      - uses: ./.github/actions/setup-terraform
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_PROD_ACCOUNT_ID }}:role/jobproof-github-plan
          role-session-name: pipeline-prod-preview
          aws-region: ${{ env.AWS_REGION }}
      - name: terraform init (state bucket of the prod account)
        run: |
          lock=()
          if [ -f .terraform.lock.hcl ]; then lock=(-lockfile=readonly); fi
          terraform init "${lock[@]}" -backend-config="bucket=jobproof-tfstate-$ACCOUNT_ID"
      - name: terraform plan for prod at this version (read-only role, no lock)
        id: plan
        env:
          VERSION: ${{ github.sha }}
        run: |
          set +e
          terraform plan -lock=false -no-color -detailed-exitcode -out=tfplan \
            -var "image_tag=$VERSION" -var "allowed_account_ids=[\"$ACCOUNT_ID\"]" \
            -var "promotion_peer_account_id=$PEER_ACCOUNT_ID" > "$RUNNER_TEMP/plan.txt" 2>&1
          code=$?
          set -e
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          head -c 20000 "$RUNNER_TEMP/plan.txt"
          # 0 = no changes, 2 = changes, anything else is an error.
          [ "$code" = "0" ] || [ "$code" = "2" ]
      - name: Summary (read this before you click Deploy to prod)
        if: always() && steps.plan.outcome != 'skipped'
        env:
          VERSION: ${{ github.sha }}
          PLAN_EXIT: ${{ steps.plan.outputs.exit }}
        run: |
          {
            echo "### If you deploy \`$VERSION\` to prod, Terraform will change:"
            echo
            case "$PLAN_EXIT" in
              0) echo "Nothing. The prod infrastructure already matches this version." ;;
              2)
                echo '```'
                terraform show -no-color tfplan | head -c 60000
                echo '```'
                ;;
              *)
                echo "The plan failed. Open the step log."
                echo '```'
                head -c 20000 "$RUNNER_TEMP/plan.txt"
                echo '```'
                ;;
            esac
            echo
            echo "To deploy: Actions, **Deploy to prod**, **Run workflow**, version = \`$VERSION\`."
          } >> "$GITHUB_STEP_SUMMARY"
