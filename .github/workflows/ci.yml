# CI checks only: no deploy, no AWS. Runs on pull requests and is called by pipeline.yml
# (INFRA-5) on pushes to main. Spec: specs/INFRA-aws-pipeline.md section 4.2.
# The steps mirror the local paths: `make lint`, `scripts/dev.sh test`, `scripts/dev.sh e2e`.
name: ci

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

# Superseded pull request runs are cancelled; runs called from a push to main never are (each
# non-pull_request run gets its own group, keyed on the run id).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.11.32" # keep equal to the uv image in backend/Dockerfile
  NODE_VERSION: "22"
  # Same default as the Makefile, so `make`-style commands work unchanged.
  TEST_DATABASE_URL: postgresql+psycopg://jobproof:jobproof@127.0.0.1:5544/jobproof_test

jobs:
  backend:
    name: backend (lint, type-check, tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        # TODO(pin): add the @sha256 digest (backlog B3); the same image is used in docker-compose.yml.
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jobproof
          POSTGRES_PASSWORD: jobproof
          POSTGRES_DB: jobproof_test
        ports:
          - 5544:5432
        options: >-
          --health-cmd "pg_isready -U jobproof -d jobproof_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install dependencies (scripts/dev.sh prepare_backend)
        run: uv sync --frozen
      - name: Load the same environment as scripts/dev.sh (.env.example values)
        working-directory: .
        run: grep -E '^[A-Z_][A-Z0-9_]*=' .env.example >> "$GITHUB_ENV"
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format check
        run: uv run ruff format --check .
      - name: mypy
        run: uv run mypy app
      - name: pytest (includes the blackhole connect-timeout test that skips in the workspace, B5)
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: uv run pytest -rs

  web:
    name: web and shared (lint, contract, tests, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: eslint and tsc (shared, web and e2e; mobile has its own job)
        run: npm run lint -w @jobproof/shared -w @jobproof/web -w @jobproof/e2e
      - name: Lint the OpenAPI contract
        run: npx --no-install redocly lint api/openapi.yaml --config api/redocly.yaml
      - name: Generated client is up to date (gen:check)
        run: npm run gen:check
      - name: Shared and web unit tests (includes the busybox test for web/nginx/*.sh)
        run: npm test -w @jobproof/shared -w @jobproof/web
      - name: Production build (includes the bundle origin check)
        run: npm run build -w @jobproof/web

  mobile:
    name: mobile (lint, tests, expo-doctor, android bundle)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Build-time server address for the config check and the bundle export only; no real server is contacted.
      API_BASE_URL: https://api.invalid
      APP_VARIANT: preview
      EXPO_OFFLINE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: eslint and tsc
        run: npm run lint -w @jobproof/mobile
      - name: Jest (logic and ui projects, config assertions)
        run: npm test -w @jobproof/mobile
      # expo-doctor is a pinned mobile devDependency (version and integrity come from the lockfile).
      # It asks the Expo API for SDK metadata, so an outage on their side must not block a merge:
      # a failure is shown as a warning annotation instead.
      - name: expo-doctor (needs the Expo API; EXPO_OFFLINE is unset for this step)
        env:
          EXPO_OFFLINE: "0"
        run: npm run doctor -w @jobproof/mobile || echo "::warning title=expo-doctor::expo-doctor failed or the Expo API was unreachable; check the log"
      - name: Android bundle (Metro resolves everything, one React copy)
        run: npm run export -w @jobproof/mobile

  e2e:
    name: e2e (Playwright against the compose stack)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Start the stack with make up (db, migrate, seed, backend, web)
        run: make up
      - name: Record base image digests (use these to close backlog B3 and B6)
        run: |
          {
            echo "### Image digests seen by this run"
            echo '```'
            for img in postgres:16-alpine python:3.13-slim nginxinc/nginx-unprivileged:stable-alpine node:22-alpine; do
              printf '%s -> ' "$img"
              docker image inspect --format '{{index .RepoDigests 0}}' "$img" 2>/dev/null || echo "not pulled"
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run the e2e suite (make e2e)
        env:
          WEB_URL: http://localhost:8080
          # Tests that write data reseed the mock data; on compose that is the seed service.
          RESEED_COMMAND: make seed
        run: make e2e
      - name: Stack logs
        if: failure()
        run: docker compose logs --no-color --tail=300
      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop the stack
        if: always()
        run: docker compose down -v

  workflows:
    name: actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint (version-pinned; Go and shellcheck are preinstalled on the runner)
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" -color

  infra:
    name: cfn-lint (infra/bootstrap)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CFN_LINT_VERSION: "1.60.0" # latest on PyPI when pinned (2026-11-09); bump deliberately
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: cfn-lint (version-pinned, in a throwaway virtualenv)
        run: |
          python3 -m venv "$RUNNER_TEMP/cfn-lint-venv"
          "$RUNNER_TEMP/cfn-lint-venv/bin/pip" install --quiet "cfn-lint==${CFN_LINT_VERSION}"
          "$RUNNER_TEMP/cfn-lint-venv/bin/cfn-lint" infra/bootstrap/bootstrap.cfn.yaml

  terraform:
    name: terraform (fmt, validate, tflint)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TFLINT_VERSION: "v0.66.0" # latest release tag when pinned (2026-11-09); bump deliberately
      TF_IN_AUTOMATION: "1"
      TF_INPUT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-terraform
      - name: terraform fmt -check (the whole tree)
        run: terraform fmt -check -recursive -diff infra/terraform
      - name: dev and prod differ only in tfvars, backend and guard.tf
        run: bash infra/terraform/check-env-parity.sh
      - name: terraform init -backend=false and validate (dev, prod). Needs the registry, no AWS credentials
        id: validate
        run: |
          set -euo pipefail
          for env in dev prod; do
            echo "::group::terraform validate ($env)"
            cd "$GITHUB_WORKSPACE/infra/terraform/envs/$env"
            if [ -f .terraform.lock.hcl ]; then
              echo "lock_$env=committed" >> "$GITHUB_OUTPUT"
              terraform init -backend=false -lockfile=readonly
            else
              echo "lock_$env=missing" >> "$GITHUB_OUTPUT"
              terraform init -backend=false
            fi
            terraform validate -no-color
            echo "::endgroup::"
          done
      - name: tflint (modules and both environments; version-pinned, built from source like actionlint)
        run: |
          go install "github.com/terraform-linters/tflint@${TFLINT_VERSION}"
          tflint="$(go env GOPATH)/bin/tflint"
          "$tflint" --version
          "$tflint" --recursive --chdir infra/terraform --config "$GITHUB_WORKSPACE/infra/terraform/.tflint.hcl" --format compact
      - name: Provider lock files for all platforms (only while they are not committed)
        if: steps.validate.outputs.lock_dev == 'missing' || steps.validate.outputs.lock_prod == 'missing'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lockfiles/dev" "$RUNNER_TEMP/lockfiles/prod"
          for env in dev prod; do
            cd "$GITHUB_WORKSPACE/infra/terraform/envs/$env"
            terraform providers lock -platform=linux_amd64 -platform=linux_arm64 -platform=darwin_arm64 -platform=darwin_amd64 -platform=windows_amd64
            cp .terraform.lock.hcl "$RUNNER_TEMP/lockfiles/$env/.terraform.lock.hcl"
          done
      - name: Upload the lock files (download them and commit each into its envs/<env>/ folder)
        if: steps.validate.outputs.lock_dev == 'missing' || steps.validate.outputs.lock_prod == 'missing'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: terraform-lockfiles
          path: ${{ runner.temp }}/lockfiles
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
