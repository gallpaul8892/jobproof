        - paid_pence
        - balance_pence
        - currency
        - issue_date
        - due_date
      properties:
        id: { type: string, format: uuid }
        number: { type: string, examples: ["INV-0187"] }
        status: { $ref: "#/components/schemas/InvoiceStatus" }
        subtotal_pence: { type: integer, minimum: 0, description: Work value excluding VAT }
        vat_pence: { type: integer, minimum: 0, description: VAT at 20% on subtotal }
