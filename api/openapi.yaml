openapi: 3.1.0
info:
  title: JobProof API
  version: 0.6.0
  summary: Contract between the JobProof backend and its web and mobile clients.
  description: |
    Source of truth for the JobProof API (see ARCHITECTURE.md section 5 for conventions).

    - JSON with snake_case fields. Datetimes are ISO 8601 UTC with a `Z` suffix; calendar dates
      are `YYYY-MM-DD` and are Europe/London calendar days.
    - Money is integer pence (`*_pence`) with `currency` `GBP`.
    - Errors are RFC 9457 problem details (`application/problem+json`).
    - List endpoints are offset paginated with `page` (1-based) and `page_size` (max 100).
    - Personas (one role per user): every `/api/v1/manager/*` operation requires role `manager`
      and every `/api/v1/admin/*` operation requires role `admin`. No token or an invalid/expired
      token gives 401 `unauthenticated`; a valid token with any other role gives 403 `forbidden`.
      An admin gets 403 on manager operations and a manager gets 403 on admin operations.
    - Writes (Phase 2a, T-002): Admin settings, marking a report reviewed, editing a report and
      (T-002n) editing a customer's contact details. Report and customer writes use optimistic
      concurrency: the body carries the `version` the client loaded; a mismatch is 409
      `version_conflict` and nothing is saved.
    - Admin and Manager are separate roles. An Admin may be technical staff rather than a
      manager, so an Admin never reads or changes reports, customers or billing (403).
    - Operative app (Phase 2b, T-003, v0.6.0): every `/api/v1/operative/*` operation requires
      role `painter` (shown as "Operative") and acts only on jobs assigned to the caller; another
      operative's job is 404 `not_found`, never 403. Operative responses never contain
      `manager_notes`, money, customer email or billing details. Device sessions
      (`/api/v1/auth/sessions*`) issue a 15-minute access token plus a rotating refresh token.
      The app sends `X-App-Version` (semver) on every call; below the configured minimum,
      operative and session operations answer 426 `app_update_required` (T-003n).
      Client-generated UUIDs make writes safe to repeat: photo ids, and `submission_id` on submit.
    - `x-ticket` marks operations, parameters and properties added by a ticket (T-002x, T-003x,
      INFRA-n). Backend
      contract tests ignore items whose ticket is listed in `PENDING_TICKETS`
      (`backend/tests/contract.py`) until that ticket is built; the ticket's last step removes
      its id. Component schemas are never marked (only the operations, parameters and
      properties that use them), so nothing visible ever references a hidden schema.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: http://localhost:8000
    description: Local (docker compose or scripts/dev.sh)
tags:
  - name: health
    description: Liveness and readiness for load balancers and compose healthchecks.
  - name: auth
    description: Sign-in and current user.
  - name: branding
    description: Public company name and theme (no sign-in needed).
  - name: admin
    description: Admin-only company settings.
  - name: manager
    description: Manager-only endpoints (reports, review, edit, history, customers, billing).
  - name: photos
    description: Signed photo image delivery.
  - name: app
    description: Public app status (server time, minimum supported mobile app version).
  - name: operative
    description: Operative-only endpoints (role `painter`), scoped to the caller's own jobs.
security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Liveness and database readiness
      security: []
      responses:
        "200":
          description: Service and database are up
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: Database unreachable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /health/live:
    get:
      tags: [health]
      operationId: getHealthLive
      x-ticket: INFRA-3
      summary: Process liveness only (no database check)
      description: |
        For the load balancer target group. It never touches the database, so a database
        failover does not make the load balancer stop every task. Use `/health` for readiness.
      security: []
      responses:
        "200":
          description: The process is serving requests
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthLive" }

  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Exchange email and password for a short-lived access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "401":
          description: Wrong email or password, or account inactive (code `invalid_credentials`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/v1/auth/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: The signed-in user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/v1/auth/demo-accounts:
    get:
      tags: [auth]
      operationId: listDemoAccounts
      summary: Seeded demo credentials for the dev login page
      description: |
        Available only when `DEMO_ACCOUNTS_ENABLED=true` (local and test). Returns 404 when
        disabled, and the service refuses to start with it enabled unless `APP_ENV` is `local` or `test`.
      security: []
      responses:
        "200":
          description: Demo accounts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DemoAccount" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/auth/sessions:
    post:
      tags: [auth]
      operationId: createDeviceSession
      x-ticket: T-003b
      summary: Operative sign-in on a device (mobile app); returns access and refresh tokens
      description: |
        Only role `painter` may create a device session. The password is checked first (wrong
        email or password, or an inactive account: 401 `invalid_credentials`, same as
        `login`); a correct password for a manager or admin gives 403 `operatives_only` and no
        session is created. A new session for the same user and `device_id` revokes that
        device's previous session. The access token is a JWT (claims as `login` plus `sid`),
        valid `expires_in` seconds (default 900). The refresh token is opaque, single use
        (rotated on every refresh) and expires after 30 days without use or 90 days after
        sign-in, whichever is first (`refresh_expires_at`). Clients must not judge expiry by the
        device clock: they try a refresh and let the server decide.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceSessionRequest" }
      responses:
        "201":
          description: Signed in on this device
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceSession" }
        "401":
          description: Wrong email or password, or account inactive (code `invalid_credentials`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          description: Correct password but not an operative (code `operatives_only`); no session kept
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "426": { $ref: "#/components/responses/UpdateRequired" }

  /api/v1/auth/sessions/refresh:
    post:
      tags: [auth]
      operationId: refreshDeviceSession
      x-ticket: T-003b
      summary: Exchange a refresh token for a new access token and a new refresh token
      description: |
        Rotation: the token sent is spent and a new pair is returned. Re-sending the token that
        was just replaced, within 60 seconds of its rotation, is treated as a lost response and
        returns another new pair (the unreceived one stops working). Re-sending any older token,
        or the previous one after that window, revokes the whole session (theft detection).
        401 `session_ended` for an unknown, expired, revoked or reused token; 401
        `account_inactive` when the user has been deactivated (the session is revoked too).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "200":
          description: New token pair
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceSession" }
        "401":
          description: Session over (code `session_ended`) or account deactivated (code `account_inactive`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "426": { $ref: "#/components/responses/UpdateRequired" }

  /api/v1/auth/sessions/current:
    delete:
      tags: [auth]
      operationId: endDeviceSession
      x-ticket: T-003b
      summary: Sign out this device (revoke the session of the bearer token)
      description: |
        Revokes the session named by the access token's `sid`; its refresh token stops working
        at once. Idempotent: an already revoked session, or a token without `sid` (web), is 204.
      responses:
        "204":
          description: Signed out
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/v1/branding:
    get:
      tags: [branding]
      operationId: getBranding
      x-ticket: T-002a
      summary: Company name and theme for this deployment
      description: |
        Public: used by the login page before anyone signs in. Returns only the company name and
        the theme. Clients should revalidate on every load (`Cache-Control: no-cache`).
      security: []
      responses:
        "200":
          description: Branding
          headers:
            Cache-Control:
              schema: { type: string, const: no-cache }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Branding" }

  /api/v1/app/status:
    get:
      tags: [app]
      operationId: getAppStatus
      x-ticket: T-003a
      summary: Server time and the minimum supported mobile app version
      description: |
        Public and cheap (no database access). The app calls it on launch and at the start of
        each sync run to check it can reach the server, to measure the phone clock's offset
        (`server_time` minus the device time at the midpoint of the request) and to learn the
        minimum supported version. `Cache-Control: no-store`.
      security: []
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppStatus" }

  /api/v1/admin/settings:
    get:
      tags: [admin]
      operationId: getAdminSettings
      x-ticket: T-002b
      summary: Current company settings
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSettings" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    patch:
      tags: [admin]
      operationId: updateAdminSettings
      x-ticket: T-002c
      summary: Change the company name, colour scheme and/or contact-detail rules
      description: |
        Partial update. Send `company_name`, `theme`, `uk_only_contact_details` (T-002p) or any
        combination. A field that is omitted is
        unchanged. A save that changes nothing returns 200 with the current settings, leaves
        `updated_at`/`updated_by` alone and records no audit event. Last write wins (single
        settings record, no version). Colours are accepted in either case and stored upper case.
        Each of `theme.primary` and `theme.accent` must reach 4.5:1 contrast (WCAG 2.2 AA) against
        both `#FFFFFF` and the fixed surface colour (`theme.surface`, default `#F4F7F2`), because
        accent text appears on both. The lower of the two ratios is the one measured. Else 422 `contrast_too_low` with one `errors` entry per failing colour
        carrying `measured_ratio` and `required_ratio`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminSettingsUpdate" }
      responses:
        "200":
          description: Saved (or unchanged)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSettings" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          description: |
            Invalid body (code `validation_error`) or a colour below 4.5:1 against white or the surface colour (code
            `contrast_too_low`). Format errors are reported before contrast.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /api/v1/admin/settings/history:
    get:
      tags: [admin]
      operationId: listAdminSettingsHistory
      x-ticket: T-002f
      summary: Settings change history, newest first (latest 100)
      responses:
        "200":
          description: Audit events for the settings record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditHistory" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/manager/dashboard:
    get:
      tags: [manager]
      operationId: getManagerDashboard
      summary: Summary figures, the review queue and the five most recent reports
      responses:
        "200":
          description: Dashboard
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dashboard" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/manager/painters:
    get:
      tags: [manager]
      operationId: listManagerPainters
      summary: All field workers (role painter; "Operatives" in the UI), for filter options
      responses:
        "200":
          description: Painters ordered by name
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PersonRef" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/manager/reports:
    get:
      tags: [manager]
      operationId: listManagerReports
      summary: Paginated, filterable list of job completion reports
      description: |
        `sort=default` (or no `sort`): `completed_on` descending, then `submitted_at`
        descending, then `job_reference` descending. `sort=submitted_asc`: `submitted_at`
        ascending, then `job_reference` ascending (the review queue order). All filters combine
        with AND. `total` is the count of all matching rows across pages.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: sort
          in: query
          x-ticket: T-002k
          schema: { $ref: "#/components/schemas/ReportSort" }
        - name: review_status
          in: query
          schema: { $ref: "#/components/schemas/ReviewStatus" }
        - name: billing_status
          in: query
          schema: { $ref: "#/components/schemas/BillingStatus" }
        - name: painter_id
          in: query
          schema: { type: string, format: uuid }
        - name: customer_id
          in: query
          x-ticket: T-002n
          description: Only reports for this customer's jobs (the customer page list). Unknown id gives an empty page.
          schema: { type: string, format: uuid }
        - name: date_from
          in: query
          description: Inclusive lower bound on `completed_on`.
          schema: { type: string, format: date }
        - name: date_to
          in: query
          description: Inclusive upper bound on `completed_on`. Must not be before `date_from`.
          schema: { type: string, format: date }
        - name: q
          in: query
          description: |
            Case-insensitive substring match (trimmed, 1 to 100 characters) against customer
            name, any site address field (line 1, line 2, town, county, postcode, also matched
            with spaces removed) and job reference.
          schema: { type: string, minLength: 1, maxLength: 100 }
      responses:
        "200":
          description: A page of reports
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportPage" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/v1/manager/reports/{report_id}:
    get:
      tags: [manager]
      operationId: getManagerReport
      summary: Full evidence for one report
      parameters:
        - name: report_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Report detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportDetail" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    patch:
      tags: [manager]
      operationId: updateManagerReport
      x-ticket: T-002i
      summary: Edit painter notes, manager notes and checklist done/note
      description: |
        Partial update with optimistic concurrency. `version` is the version the client loaded
        and is required. Only `painter_notes`, `manager_notes` and, per existing checklist item,
        `done` and `note` are editable; any other field (photos, labels, review fields, job,
        customer, unknown keys) is 422. An empty or whitespace-only notes string is stored as
        null. Order of checks: body validation (422), report exists (404), checklist ids belong
        to this report and are unique (422), version matches (409 `version_conflict`). If the
        body repeats the current values the response is 200 with the same `version`, nothing is
        written and no audit event is recorded. Otherwise `version` increases by 1, a
        `report.edited` event is recorded, and if the report was reviewed it returns to
        `awaiting_review` with `reviewed_at`/`reviewed_by` cleared and a `report.reopened` event.
        All in one transaction.
      parameters:
        - name: report_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportUpdate" }
      responses:
        "200":
          description: Saved (or unchanged); the full, current report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportDetail" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The report changed since the client loaded it (code `version_conflict`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/VersionConflictProblem" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/v1/manager/reports/{report_id}/review:
    post:
      tags: [manager]
      operationId: reviewManagerReport
      x-ticket: T-002g
      summary: Mark an awaiting-review report as reviewed
      description: |
        Records the caller and the server time as reviewer, increases `version` by 1 and records
        a `report.reviewed` event. Order of checks: body (422), report exists (404), version
        matches (409 `version_conflict`), not already reviewed (409 `already_reviewed`).
        Concurrent calls are serialised by a row lock: exactly one succeeds.
      parameters:
        - name: report_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewRequest" }
      responses:
        "200":
          description: Reviewed; the full, current report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportDetail" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Stale version (`version_conflict`) or already reviewed (`already_reviewed`)
          content:
            application/problem+json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/VersionConflictProblem"
                  - $ref: "#/components/schemas/AlreadyReviewedProblem"
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/v1/manager/reports/{report_id}/history:
    get:
      tags: [manager]
      operationId: listManagerReportHistory
      x-ticket: T-002f
      summary: Audit events for one report, newest first (latest 100)
      description: |
        The report's own events plus (T-002n) every `customer.edited` event of the customer of
        the report's job, merged in `seq` order, so a change of customer details shows in the
        history of every report that uses that customer. `total` counts both kinds.
      parameters:
        - name: report_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: History
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditHistory" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/v1/manager/customers/{customer_id}:
    get:
      tags: [manager]
      operationId: getManagerCustomer
      x-ticket: T-002n
      summary: One customer's details, version and how many records use them
      parameters:
        - name: customer_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Customer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerRecord" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    patch:
      tags: [manager]
      operationId: updateManagerCustomer
      x-ticket: T-002n
      summary: Correct a customer's name, contact name, email, phone or billing address
      description: |
        Partial update with optimistic concurrency, manager only (admin and painter 403).
        `version` is the customer version the client loaded and is required. Editable: `name`,
        `contact_name`, `email`, `phone` and the parts of `billing_address`. Anything else
        (`id`, `customer_type`, `payment_terms_days`, `notes`, job, report, photo or checklist
        data, unknown keys) is 422 naming the key. A customer is shared by all its jobs: the
        change shows on every job, report and invoice of the customer.

        Text rules (code points, after trimming the ordinary space U+0020 only): no control
        characters U+0000-001F and U+007F-009F (so no tabs or line breaks), no zero-width or
        bidi formatting characters (U+200B-200F, U+202A-202E, U+2066-2069, U+FEFF) and no lone
        surrogates: the company-name rule. Nullable fields: empty or space-only is stored as
        null. Required fields (`name`, `billing_address.line1`, `town`, `postcode`) cannot be
        null or blank.

        Postcode and phone depend on the company setting `uk_only_contact_details` (T-002p,
        `GET /branding`). When true (the default): `postcode` must be a UK postcode in any case
        and spacing and is stored upper case as outward code, one space, inward code (`bs65qa`
        -> `BS6 5QA`); `phone` may contain digits, spaces, `-`, `(`, `)` and a leading `+`, and
        must be a UK number (`0` then 9 or 10 digits, or `+44`, optionally `(0)`, then 9 or 10
        digits). When false: `postcode` is any 2 to 12 characters of letters A-Z, digits, spaces
        and hyphens, starting and ending with a letter or digit, stored upper case with runs of
        spaces collapsed (a valid UK postcode still gets the UK form); `phone` may also be an
        international number (`+`, then 8 to 15 digits). Phone is stored trimmed with runs of
        spaces collapsed. Errors are 422 `errors` entries as for every other field; because the
        two rules need the setting they are checked after the rest of the body validates, so a
        body with other errors reports phone and postcode problems on the next attempt.
        Existing stored values are never revalidated by the setting. `email` is trimmed and must look like `local@domain.tld` (no spaces, one
        `@`); stored as entered. Only the keys sent are validated, so an unusual stored value
        that the manager did not touch never blocks a save.

        Order of checks: body validation (422), customer exists (404), version matches (409
        `version_conflict`). If every sent value (after normalising) equals the stored one,
        the response is 200 with the same `version`, nothing is written and no event is
        recorded. Otherwise `version` increases by 1, `last_changed_at`/`last_changed_by` are
        set and one `customer.edited` event with old and new values is recorded, all in one
        transaction. Report versions and review status are not changed: a reviewed report
        stays reviewed, and the change appears in its history.
      parameters:
        - name: customer_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerUpdate" }
      responses:
        "200":
          description: Saved (or unchanged); the full, current customer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerRecord" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The customer changed since the client loaded it (code `version_conflict`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/CustomerVersionConflictProblem" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/v1/manager/customers/{customer_id}/history:
    get:
      tags: [manager]
      operationId: listManagerCustomerHistory
      x-ticket: T-002n
      summary: Changes to one customer's details, newest first (latest 100)
      parameters:
        - name: customer_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: History (only `customer.edited` events)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditHistory" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/v1/manager/invoices:
    get:
      tags: [manager]
      operationId: listManagerInvoices
      summary: Paginated list of invoices, filterable by status
      description: |
        Sorted by `issue_date` descending with drafts (no issue date) first, then `number`
        descending. `status` filters on the derived status.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/InvoiceStatus" }
      responses:
        "200":
          description: A page of invoices
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvoicePage" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/v1/operative/jobs:
    get:
      tags: [operative]
      operationId: listOperativeJobs
      x-ticket: T-003c
      summary: The caller's jobs for today plus earlier unfinished ones, with full detail
      description: |
        `jobs_today` (`today` = Europe/London calendar day of the server clock): every job assigned to the
        caller with `scheduled_start` today, whatever its state, ordered open jobs first
        (`in_progress`, `to_do`), then `submitted`, `completed_by_office`, `cancelled`, then by
        `reference`. `earlier_unfinished`: jobs assigned to the caller with `scheduled_start`
        before today and not more than 30 days back, not completed or cancelled, and with no
        submitted report, ordered by `scheduled_start` then `reference`, at most 50 (the oldest
        50 if there are more). A job whose draft was started by another operative (the job was
        reassigned) is left out of both lists. Each item is a full `OperativeJob` so the app can
        store every listed job for offline use with one request. A job reassigned to someone
        else simply stops appearing.
      responses:
        "200":
          description: My jobs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperativeJobList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "426": { $ref: "#/components/responses/UpdateRequired" }

  /api/v1/operative/jobs/{job_id}:
    get:
      tags: [operative]
      operationId: getOperativeJob
      x-ticket: T-003d
      summary: One of the caller's jobs (any date), with checklist, contact and report state
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperativeJob" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`draft_owned_by_other`: the job was reassigned after another operative started its draft report; the office must resolve it"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "426": { $ref: "#/components/responses/UpdateRequired" }

  /api/v1/operative/jobs/{job_id}/report:
    patch:
      tags: [operative]
      operationId: saveOperativeDraft
      x-ticket: T-003f
      summary: Save draft report fields (creates the draft on first use)
      description: |
        One report per job; the job id identifies it, so repeating a call is safe. The first
        write (this, or registering a photo) creates the draft and moves a `scheduled` job to
        `in_progress`. Only the fields sent change; per checklist item only `status` and/or
        `note` sent change. Last write wins per field (the operative is the only writer of a
        draft). `not_done` without a note is allowed in a draft and refused at submit. Notes
        follow the multi-line text rule (NUL and lone surrogates refused). Order of checks: body
        (422), job is the caller's (404), draft not started by another operative (409
        `draft_owned_by_other`), job not cancelled (409 `job_cancelled`) or closed by
        the office (409 `job_closed`), report not submitted (409 `report_submitted`), item ids
        belong to the job (422).
      parameters:
        - $ref: "#/components/parameters/JobId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DraftUpdate" }
      responses:
        "200":
          description: Saved; the full job with its report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperativeJob" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`report_submitted`, `job_cancelled`, `job_closed` or `draft_owned_by_other` (the draft was started by another operative before a reassignment); nothing saved"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "426": { $ref: "#/components/responses/UpdateRequired" }

  /api/v1/operative/jobs/{job_id}/report/submit:
    post:
      tags: [operative]
      operationId: submitOperativeReport
      x-ticket: T-003h
      summary: Submit the completion report (safe to repeat with the same submission_id)
      description: |
        Applies `draft` (if sent) and submits, in one transaction under a row lock on the job.
        Repeating with the same `submission_id` after success returns 200 and the current job
        (no change). A different `submission_id` on a submitted report is 409
        `already_submitted` with `submitted_at` (the other device or attempt won). Every id in
        `photo_ids` must already be registered (else 409 `photos_not_registered` listing the
        missing ids; register them, then retry); photos registered but not yet uploaded count
        as present and may upload afterwards (`pending_photo_count` on the manager's report).
        Completeness (422 `submission_incomplete`, one `errors` entry per problem, `loc`
        `["photos","before"]`, `["photos","after"]` or `["checklist","<item id>"]`): at least
        one registered Before and one After photo; every checklist item not removed by the
        office is done, or not done with a non-blank note. On success: report `submitted`,
        `submitted_at` = server time, `review_status` `awaiting_review`, job `completed` with
        `completed_on` = the later of `scheduled_start` and the London date of `submitted_at`,
        and a `report.submitted` audit event. Order of checks: body (422), job is the caller's
        (404), replay or `already_submitted` (409), `job_cancelled`/`job_closed` (409),
        `photos_not_registered` (409), `submission_incomplete` (422).
      parameters:
        - $ref: "#/components/parameters/JobId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmitRequest" }
      responses:
        "200":
          description: Submitted (or already submitted by this same submission); the full job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperativeJob" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`already_submitted`, `photos_not_registered`, `job_cancelled` or `job_closed`"
          content:
            application/problem+json:
              schema:
                # anyOf, not oneOf: the two specific problems are also valid `Problem`s.
                anyOf:
                  - $ref: "#/components/schemas/AlreadySubmittedProblem"
                  - $ref: "#/components/schemas/PhotosNotRegisteredProblem"
                  - $ref: "#/components/schemas/Problem"
        "422":
          description: Invalid body (`validation_error`) or report not complete (`submission_incomplete`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "426": { $ref: "#/components/responses/UpdateRequired" }

  /api/v1/operative/jobs/{job_id}/photos/{photo_id}:
    put:
      tags: [operative]
      operationId: registerOperativePhoto
      x-ticket: T-003g
      summary: Register a photo's metadata (client-generated id), or change its stage, item or caption
      description: |
        Step 1 of 2 for a photo (step 2 uploads the file). Creates the draft if needed. 201 when
        created, 200 when the photo already exists with the same evidence fields (a safe
        repeat); `stage`, `checklist_item_id` and `caption` may change while the report is a
        draft. Evidence fields are fixed at registration and any difference is 409
        `photo_content_mismatch` (also when the id is used by another job): `source`,
        `taken_at`, `taken_at_source`, `location`, `original`, `upload`. Limits: 60 photos per
        report, 12 per checklist item (409 `photo_limit_reached`). The same `original.sha256`
        twice in one report is 409 `duplicate_photo` with `existing_photo_id`. After
        submission: an identical repeat is 200; any change is 409 `report_submitted`.
        `clock_offset_seconds` = server time minus `device_sent_at`, so the app sets
        `device_sent_at` when it sends the request, not when it queued it.
      parameters:
        - $ref: "#/components/parameters/JobId"
        - $ref: "#/components/parameters/PhotoId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PhotoRegistration" }
      responses:
        "200":
          description: Already registered (unchanged or mutable fields updated)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperativePhoto" }
        "201":
          description: Registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperativePhoto" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`photo_content_mismatch`, `duplicate_photo`, `photo_limit_reached`, `report_submitted`, `job_cancelled` or `job_closed`"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "426": { $ref: "#/components/responses/UpdateRequired" }
    delete:
      tags: [operative]
      operationId: deleteOperativePhoto
      x-ticket: T-003g
      summary: Delete a photo from a draft (row and stored files)
      description: |
        Draft only (409 `report_submitted` afterwards). Idempotent: an unknown photo id on the
        caller's job is 204. No audit event: a draft photo never reached the office.
      parameters:
        - $ref: "#/components/parameters/JobId"
        - $ref: "#/components/parameters/PhotoId"
      responses:
        "204":
          description: Deleted (or never existed)
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Report already submitted (code `report_submitted`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "426": { $ref: "#/components/responses/UpdateRequired" }

  /api/v1/operative/jobs/{job_id}/photos/{photo_id}/content:
    put:
      tags: [operative]
      operationId: uploadOperativePhotoContent
      x-ticket: T-003g
      summary: Upload the photo file (raw body), step 2 of 2
      description: |
        The body is the upload copy's bytes, exactly as registered: `Content-Type` equal to
        `upload.content_type` (`image/jpeg` or `image/png`, checked against the file's magic
        bytes), `Content-Length` required and at most 10 MiB (else 413 `photo_too_large` before
        the body is read), SHA-256 equal to `upload.sha256` (else 422 `checksum_mismatch`;
        retry), decodable with the registered `upload.width`/`upload.height` (else 415
        `unsupported_photo_type`). Allowed after submission for photos registered before it.
        Idempotent: once stored, the same bytes return 200 and nothing is rewritten; a stored
        photo is never replaced (409 `photo_content_mismatch` for different bytes). The server
        removes embedded metadata (EXIF, XMP, IPTC, PNG text chunks) without re-encoding, makes
        a thumbnail, and stores both privately. 503 `busy` with `Retry-After` when the server is
        processing its maximum number of uploads.
      parameters:
        - $ref: "#/components/parameters/JobId"
        - $ref: "#/components/parameters/PhotoId"
      requestBody:
        required: true
        content:
          image/jpeg:
            schema: { type: string, contentMediaType: image/jpeg }
          image/png:
            schema: { type: string, contentMediaType: image/png }
      responses:
        "200":
          description: Stored (or already stored with these bytes)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperativePhoto" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Different bytes for an already stored photo (code `photo_content_mismatch`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "413":
          description: Over 10 MiB or over the pixel limit (code `photo_too_large`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "415":
          description: Not a JPEG or PNG matching the registration (code `unsupported_photo_type`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422":
          description: Checksum differs from the registration (code `checksum_mismatch`), or invalid path
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "426": { $ref: "#/components/responses/UpdateRequired" }
        "503":
          description: Too many uploads in progress (code `busy`); retry after `Retry-After` seconds
          headers:
            Retry-After:
              schema: { type: integer, examples: [5] }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /api/v1/photos/{photo_id}/image:
    get:
      tags: [photos]
      operationId: getPhotoImage
      summary: Photo bytes via a signed URL
      description: |
        Clients never build this URL; they use `url` / `thumb_url` from `ReportPhoto`. The
        signature is `hex(HMAC-SHA256(PHOTO_URL_SECRET, "{photo_id}:{variant}:{exp}"))`.
        Serves the generated SVG placeholders of seeded photos (no stored file). Photos uploaded
        from the app (T-003g) are not served here: their `url`/`thumb_url` are short-lived
        presigned object-storage URLs on another origin. Clients must treat every URL as opaque.
      security: []
      parameters:
        - name: photo_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: variant
          in: query
          required: true
          schema: { type: string, enum: [thumb, full] }
        - name: exp
          in: query
          required: true
          description: Expiry, Unix seconds.
          schema: { type: integer }
        - name: sig
          in: query
          required: true
          schema: { type: string, pattern: "^[0-9a-f]{64}$" }
      responses:
        "200":
          description: Image
          headers:
            Cache-Control:
              schema: { type: string, example: "private, max-age=300" }
          content:
            image/svg+xml:
              schema: { type: string }
        "403":
          description: Signature invalid or expired (code `invalid_signature`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: page_size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    JobId:
      name: job_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    PhotoId:
      name: photo_id
      in: path
      required: true
      description: Generated on the phone (UUID v4) when the photo is taken; the idempotency key
      schema: { type: string, format: uuid }

  responses:
    UpdateRequired:
      description: App version below the minimum supported (code `app_update_required`)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthenticated:
      description: Missing, invalid or expired token (code `unauthenticated`)
      headers:
        WWW-Authenticate:
          schema: { type: string, example: Bearer }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: Authenticated but role not allowed (code `forbidden`)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: Resource does not exist (code `not_found`)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    ValidationError:
      description: Invalid parameters or body (code `validation_error`)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details with JobProof extensions.
      required: [type, title, status, code, request_id]
      properties:
        type:
          type: string
          description: "`about:blank` or `https://jobproof.dev/problems/{code}`"
          examples: ["https://jobproof.dev/problems/forbidden"]
        title: { type: string, examples: ["Forbidden"] }
        status: { type: integer, examples: [403] }
        detail: { type: string, examples: ["Manager role required."] }
        instance: { type: string, examples: ["/api/v1/manager/dashboard"] }
        code:
          type: string
          enum:
            - unauthenticated
            - invalid_credentials
            - forbidden
            - not_found
            - validation_error
            - invalid_signature
            - internal_error
            - contrast_too_low
            - version_conflict
            - already_reviewed
            # T-003 (operative app)
            - operatives_only
            - session_ended
            - account_inactive
            - app_update_required
            - job_cancelled
            - job_closed
            - report_submitted
            - already_submitted
            - photos_not_registered
            - submission_incomplete
            - photo_limit_reached
            - photo_content_mismatch
            - duplicate_photo
            - photo_too_large
            - unsupported_photo_type
            - checksum_mismatch
            - busy
            - draft_owned_by_other
        request_id: { type: string }
        errors:
          type: array
          description: Present for `validation_error` and `contrast_too_low`.
          items: { $ref: "#/components/schemas/FieldError" }

    FieldError:
      type: object
      required: [loc, message]
      properties:
        loc:
          type: array
          items: { oneOf: [{ type: string }, { type: integer }] }
          examples: [["query", "page_size"]]
        message: { type: string }
        measured_ratio:
          type: number
          x-ticket: T-002e
          description: "`contrast_too_low` only: the colour's lower contrast, against white or the surface colour (the message names which), rounded to 2 decimals (never shown as 4.50 when below 4.5)"
          examples: [2.78]
        required_ratio:
          type: number
          x-ticket: T-002e
          description: "`contrast_too_low` only"
          examples: [4.5]

    Health:
      type: object
      required: [status, database, version]
      properties:
        status: { type: string, enum: [ok, degraded] }
        database: { type: string, enum: [ok, unavailable] }
        version: { type: string, examples: ["0.1.0"] }

    HealthLive:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok] }

    Role:
      type: string
      description: "`painter` is the field worker, shown as \"Operative\" in the UI (T-002l)."
      enum: [manager, painter, admin]

    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email: { type: string, minLength: 3, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 200 }

    LoginResponse:
      type: object
      required: [access_token, token_type, expires_in, user]
      properties:
        access_token: { type: string }
        token_type: { type: string, const: bearer }
        expires_in: { type: integer, description: Seconds until expiry, examples: [1800] }
        user: { $ref: "#/components/schemas/User" }

    User:
      type: object
      required: [id, email, full_name, role]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        full_name: { type: string, examples: ["Sarah Whitfield"] }
        role: { $ref: "#/components/schemas/Role" }

    DemoAccount:
      type: object
      required: [role, email, password, full_name]
      properties:
        role: { $ref: "#/components/schemas/Role" }
        email: { type: string }
        password: { type: string }
        full_name: { type: string }

    PersonRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }

    Currency:
      type: string
      const: GBP

    JobType:
      type: string
      enum:
        - interior_repaint
        - exterior_repaint
        - wallpapering
        - kitchen_cabinet_spray
        - staircase_woodwork
        - commercial_unit

    JobStatus:
      type: string
      enum: [scheduled, in_progress, completed, cancelled]

    CustomerType:
      type: string
      enum: [homeowner, landlord, business]

    ReviewStatus:
      type: string
      description: "`awaiting_review` = submitted by painter, not yet reviewed by a manager."
      enum: [awaiting_review, reviewed]

    ReportSort:
      type: string
      enum: [default, submitted_asc]

    InvoiceStatus:
      type: string
      description: |
        Derived. Precedence: void, draft, paid (balance 0), overdue (due date before today,
        Europe/London, and balance > 0, including part-paid), part_paid, sent.
      enum: [draft, sent, part_paid, overdue, paid, void]

    BillingStatus:
      type: string
      description: Status of a job's invoice, or `not_invoiced` when it has none.
      enum: [not_invoiced, draft, sent, part_paid, overdue, paid, void]

    PhotoStage:
      type: string
      enum: [before, during, after]

    Address:
      type: object
      required: [line1, town, postcode]
      properties:
        line1: { type: string }
        line2: { type: [string, "null"] }
        town: { type: string }
        county: { type: [string, "null"] }
        postcode: { type: string, examples: ["BS6 5QA"] }

    Dashboard:
      type: object
      required:
        - as_of
        - period_start
        - period_end
        - reports_awaiting_review
        - jobs_completed_this_month
        - invoiced_this_month_pence
        - outstanding_pence
        - overdue_invoice_count
        - currency
        - review_queue
        - recent_reports
      properties:
        as_of: { type: string, format: date-time, description: Server "now" used for the figures }
        period_start: { type: string, format: date, description: First day of the current London month }
        period_end: { type: string, format: date, description: Last day of the current London month }
        reports_awaiting_review: { type: integer, minimum: 0 }
        jobs_completed_this_month:
          type: integer
          minimum: 0
          description: Jobs with `completed_on` in the current London month.
        invoiced_this_month_pence:
          type: integer
          minimum: 0
          description: Sum of `total_pence` of non-draft, non-void invoices with `issue_date` in the current London month.
        outstanding_pence:
          type: integer
          minimum: 0
          description: Sum of `balance_pence` over invoices with status sent, part_paid or overdue.
        overdue_invoice_count: { type: integer, minimum: 0 }
        currency: { $ref: "#/components/schemas/Currency" }
        review_queue:
          type: array
          maxItems: 5
          x-ticket: T-002k
          description: |
            Up to five awaiting-review reports that have waited longest: `submitted_at`
            ascending, then `job_reference` ascending. Same order as
            `GET /manager/reports?review_status=awaiting_review&sort=submitted_asc`.
          items: { $ref: "#/components/schemas/ReportSummary" }
        recent_reports:
          type: array
          maxItems: 5
          description: Five most recently submitted reports (by `submitted_at` desc).
          items: { $ref: "#/components/schemas/ReportSummary" }

    ReportSummary:
      type: object
      required:
        - id
        - job_id
        - job_reference
        - job_type
        - customer
        - site_address
        - painter
        - completed_on
        - submitted_at
        - photo_count
        - review_status
        - billing_status
      properties:
        id: { type: string, format: uuid }
        job_id: { type: string, format: uuid }
        job_reference: { type: string, examples: ["JP-1042"] }
        job_type: { $ref: "#/components/schemas/JobType" }
        customer: { $ref: "#/components/schemas/PersonRef" }
        site_address: { $ref: "#/components/schemas/Address" }
        painter: { $ref: "#/components/schemas/PersonRef" }
        completed_on: { type: string, format: date }
        submitted_at: { type: string, format: date-time }
        photo_count: { type: integer, minimum: 0 }
        review_status: { $ref: "#/components/schemas/ReviewStatus" }
        billing_status: { $ref: "#/components/schemas/BillingStatus" }

    ReportPage:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ReportSummary" }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 100 }

    ChecklistItem:
      type: object
      required: [id, label, done, note, cannot_do, removed]
      properties:
        id: { type: string, format: uuid }
        label: { type: string, examples: ["Walls filled, sanded and spot-primed"] }
        done: { type: boolean }
        note: { type: [string, "null"] }
        cannot_do:
          type: boolean
          x-ticket: T-003k
          description: The operative marked the item "Can't do this"; `note` holds the reason. Never true with `done`. A manager setting `done` true clears it.
        removed:
          type: boolean
          x-ticket: T-003k
          description: The office removed the item from the job after the operative recorded something on it; shown under "Other photos and notes"

    ReportPhoto:
      type: object
      required:
        - id
        - stage
        - caption
        - taken_at
        - width
        - height
        - url
        - thumb_url
        - checklist_item_id
        - source
        - taken_at_source
        - received_at
        - clock_offset_seconds
        - location
      properties:
        id: { type: string, format: uuid }
        stage: { $ref: "#/components/schemas/PhotoStage" }
        caption: { type: string }
        taken_at: { type: string, format: date-time, description: "Device time (see `taken_at_source`), UTC" }
        width: { type: integer, description: Stored file pixel width }
        height: { type: integer, description: Stored file pixel height }
        url: { type: string, format: uri, description: "Signed, short-lived, opaque full-size URL" }
        thumb_url: { type: string, format: uri, description: "Signed, short-lived, opaque thumbnail URL" }
        checklist_item_id:
          type: [string, "null"]
          format: uuid
          x-ticket: T-003k
          description: The report checklist item (`ChecklistItem.id`) this photo proves, if any
        source:
          x-ticket: T-003k
          $ref: "#/components/schemas/PhotoSource"
        taken_at_source:
          x-ticket: T-003k
          $ref: "#/components/schemas/TakenAtSource"
        received_at:
          type: [string, "null"]
          format: date-time
          x-ticket: T-003k
          description: Server time the file arrived; null for seeded placeholder photos
        clock_offset_seconds:
          type: [integer, "null"]
          x-ticket: T-003k
          description: |
            Server time minus the phone's clock when the photo was registered (positive = phone
            behind). Null for seeded photos. Clients flag an absolute value over 300 seconds.
        location:
          x-ticket: T-003k
          description: Managers only. Null when no location was recorded
          oneOf:
            - $ref: "#/components/schemas/PhotoLocation"
            - type: "null"

    JobDetail:
      type: object
      required:
        - id
        - reference
        - job_type
        - title
        - status
        - site_address
        - notes
        - scheduled_start
        - completed_on
      properties:
        id: { type: string, format: uuid }
        reference: { type: string }
        job_type: { $ref: "#/components/schemas/JobType" }
        title: { type: string, examples: ["Repaint lounge, hall and landing"] }
        status: { $ref: "#/components/schemas/JobStatus" }
        site_address: { $ref: "#/components/schemas/Address" }
        notes: { type: [string, "null"], description: Office/job notes (may be long) }
        scheduled_start: { type: string, format: date }
        completed_on: { type: [string, "null"], format: date }

    CustomerDetail:
      type: object
      required: [id, name, customer_type, email, phone, billing_address, job_count]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        customer_type: { $ref: "#/components/schemas/CustomerType" }
        contact_name: { type: [string, "null"], description: For landlords and businesses }
        email: { type: [string, "null"] }
        phone: { type: [string, "null"] }
        billing_address: { $ref: "#/components/schemas/Address" }
        job_count: { type: integer, minimum: 1, description: Total jobs for this customer }

    QuoteSummary:
      type: object
      required:
        - id
        - reference
        - status
        - total_pence
        - deposit_pence
        - deposit_paid_pence
        - currency
        - issued_on
        - accepted_on
      properties:
        id: { type: string, format: uuid }
        reference: { type: string, examples: ["Q-0317"] }
        status: { type: string, enum: [draft, sent, accepted, declined, expired] }
        total_pence: { type: integer, minimum: 0 }
        deposit_pence: { type: integer, minimum: 0, description: 0 when no deposit was requested }
        deposit_paid_pence: { type: integer, minimum: 0 }
        currency: { $ref: "#/components/schemas/Currency" }
        issued_on: { type: string, format: date }
        accepted_on: { type: [string, "null"], format: date }

    InvoiceSummary:
      type: object
      required:
        - id
        - number
        - status
        - subtotal_pence
        - vat_pence
        - deposit_applied_pence
        - total_pence
        - paid_pence
        - balance_pence
        - currency
        - issue_date
        - due_date
      properties:
        id: { type: string, format: uuid }
        number: { type: string, examples: ["INV-0187"] }
        status: { $ref: "#/components/schemas/InvoiceStatus" }
        subtotal_pence: { type: integer, minimum: 0, description: Work value excluding VAT }
        vat_pence: { type: integer, minimum: 0, description: VAT at 20% on subtotal }
        deposit_applied_pence: { type: integer, minimum: 0, description: Deposit already paid on the quote and deducted }
        total_pence:
          type: integer
          minimum: 0
          description: "Amount billed on this invoice: subtotal + VAT - deposit applied."

        paid_pence: { type: integer, minimum: 0 }
        balance_pence: { type: integer, minimum: 0 }
        currency: { $ref: "#/components/schemas/Currency" }
        issue_date: { type: [string, "null"], format: date, description: Null for drafts }
        due_date: { type: [string, "null"], format: date, description: Null for drafts }

    Payment:
      type: object
      required: [id, kind, amount_pence, currency, received_at, method]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [deposit, invoice] }
        amount_pence: { type: integer, minimum: 1 }
        currency: { $ref: "#/components/schemas/Currency" }
        received_at: { type: string, format: date-time }
        method: { type: string, enum: [card, bank_transfer, cash] }

    ReportDetail:
      type: object
      required:
        - id
        - review_status
        - submitted_at
        - reviewed_at
        - reviewed_by
        - version
        - last_changed_at
        - last_changed_by
        - painter_notes
        - manager_notes
        - billing_status
        - job
        - customer
        - painter
        - checklist
        - photos
        - quote
        - invoice
        - payments
        - submitted_by
        - pending_photo_count
        - device_submitted_at
        - submit_clock_offset_seconds
        - sign_off
      properties:
        id: { type: string, format: uuid }
        review_status: { $ref: "#/components/schemas/ReviewStatus" }
        submitted_at: { type: string, format: date-time, description: Server time the submission was accepted }
        submitted_by:
          x-ticket: T-003h
          description: The operative who submitted (for seeded reports, the report's painter)
          $ref: "#/components/schemas/PersonRef"
        pending_photo_count:
          type: integer
          minimum: 0
          x-ticket: T-003h
          description: Photos registered before submission whose file has not arrived yet ("2 photos still to arrive"); they are not in `photos` until they arrive
        device_submitted_at:
          type: [string, "null"]
          format: date-time
          x-ticket: T-003k
          description: Phone time when the operative confirmed Submit (may be hours before `submitted_at` if offline). Null for seeded reports
        submit_clock_offset_seconds:
          type: [integer, "null"]
          x-ticket: T-003k
          description: Server time minus the phone clock at the moment the submit request was sent. Null for seeded reports
        sign_off:
          x-ticket: T-003o
          description: Customer sign-off recorded by the operative, if any
          oneOf:
            - $ref: "#/components/schemas/SignOff"
            - type: "null"
        reviewed_at: { type: [string, "null"], format: date-time }
        reviewed_by:
          oneOf:
            - $ref: "#/components/schemas/PersonRef"
            - type: "null"
        version:
          type: integer
          minimum: 1
          x-ticket: T-002g
          description: Starts at 1; +1 on every real change (edit or review). Send it back on writes.
        last_changed_at:
          type: [string, "null"]
          format: date-time
          x-ticket: T-002g
          description: Time of the last review or edit; null if never changed since submission
        last_changed_by:
          x-ticket: T-002g
          oneOf:
            - $ref: "#/components/schemas/PersonRef"
            - type: "null"
        painter_notes: { type: [string, "null"] }
        manager_notes:
          type: [string, "null"]
          x-ticket: T-002i
          description: Internal note by managers; never shown to the painter
        billing_status: { $ref: "#/components/schemas/BillingStatus" }
        job: { $ref: "#/components/schemas/JobDetail" }
        customer: { $ref: "#/components/schemas/CustomerDetail" }
        painter: { $ref: "#/components/schemas/PersonRef" }
        checklist:
          type: array
          items: { $ref: "#/components/schemas/ChecklistItem" }
        photos:
          type: array
          description: Ordered before, during, after, then by `taken_at`. May be empty. Only photos whose file has arrived (see `pending_photo_count`).
          items: { $ref: "#/components/schemas/ReportPhoto" }
        quote:
          oneOf:
            - $ref: "#/components/schemas/QuoteSummary"
            - type: "null"
        invoice:
          oneOf:
            - $ref: "#/components/schemas/InvoiceSummary"
            - type: "null"
        payments:
          type: array
          description: Deposit payments on the quote and payments on the invoice, by `received_at` asc.
          items: { $ref: "#/components/schemas/Payment" }

    InvoiceRow:
      type: object
      required:
        - id
        - number
        - status
        - customer
        - job_id
        - job_reference
        - report_id
        - total_pence
        - paid_pence
        - balance_pence
        - currency
        - issue_date
        - due_date
      properties:
        id: { type: string, format: uuid }
        number: { type: string, examples: ["INV-0187"] }
        status: { $ref: "#/components/schemas/InvoiceStatus" }
        customer: { $ref: "#/components/schemas/PersonRef" }
        job_id: { type: string, format: uuid }
        job_reference: { type: string }
        report_id: { type: [string, "null"], format: uuid, description: "The job's completion report, used for the link" }
        total_pence: { type: integer, minimum: 0 }
        paid_pence: { type: integer, minimum: 0 }
        balance_pence: { type: integer, minimum: 0 }
        currency: { $ref: "#/components/schemas/Currency" }
        issue_date: { type: [string, "null"], format: date }
        due_date: { type: [string, "null"], format: date }

    InvoicePage:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/InvoiceRow" }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 100 }

    HexColour:
      type: string
      description: "`#RRGGBB`, upper case in responses"
      pattern: "^#[0-9A-F]{6}$"
      examples: ["#1F5130"]

    Theme:
      type: object
      additionalProperties: false
      required: [primary, accent, background, surface, text]
      properties:
        primary: { $ref: "#/components/schemas/HexColour", description: "Header bar and primary buttons; carries white text" }
        accent: { $ref: "#/components/schemas/HexColour", description: "Links, active navigation, focus ring on white" }
        background: { $ref: "#/components/schemas/HexColour", description: "Page (fixed)" }
        surface: { $ref: "#/components/schemas/HexColour", description: "Cards, table stripes (fixed)" }
        text: { $ref: "#/components/schemas/HexColour", description: "Body text (fixed)" }

    Branding:
      type: object
      additionalProperties: false
      required: [company_name, theme, uk_only_contact_details]
      properties:
        company_name: { type: string, minLength: 1, maxLength: 60 }
        theme: { $ref: "#/components/schemas/Theme" }
        uk_only_contact_details:
          x-ticket: T-002p
          type: boolean
          description: |
            When true, customer postcodes must be UK postcodes and phone numbers UK numbers. When
            false, any 2-12 character postcode and an international phone number (`+`, 8-15
            digits) are accepted too. Clients use it for validation messages; the server enforces it.

    AdminSettings:
      type: object
      additionalProperties: false
      required: [company_name, theme, uk_only_contact_details, updated_at, updated_by]
      properties:
        company_name: { type: string, minLength: 1, maxLength: 60 }
        theme: { $ref: "#/components/schemas/Theme" }
        uk_only_contact_details:
          x-ticket: T-002p
          type: boolean
          description: Same meaning as in `Branding`
        updated_at: { type: [string, "null"], format: date-time, description: Null until the first change }
        updated_by:
          description: Name as it was at the time of the change; null until the first change
          oneOf:
            - $ref: "#/components/schemas/PersonRef"
            - type: "null"

    AdminSettingsUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        company_name:
          type: string
          description: |
            Trimmed, then 1 to 60 characters, no control characters (Unicode Cc, including NUL).
        theme:
          x-ticket: T-002e
          type: object
          additionalProperties: false
          required: [primary, accent]
          description: Both colours are required when a theme is sent. Background, surface and text are fixed.
          properties:
            primary: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }
            accent: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }
        uk_only_contact_details:
          x-ticket: T-002p
          type: boolean
          description: Admin only, like every field here. A real boolean; null and strings are rejected.

    ReviewRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: { type: integer, minimum: 1, description: The report version the manager saw }

    ChecklistItemUpdate:
      type: object
      additionalProperties: false
      required: [id]
      minProperties: 2
      properties:
        id: { type: string, format: uuid, description: An existing item of this report }
        done: { type: boolean }
        note: { type: [string, "null"], maxLength: 500, description: Empty or whitespace-only is stored as null }

    ReportUpdate:
      type: object
      additionalProperties: false
      required: [version]
      minProperties: 2
      description: "`version` plus at least one editable field."
      properties:
        version: { type: integer, minimum: 1 }
        painter_notes: { type: [string, "null"], maxLength: 5000 }
        manager_notes: { type: [string, "null"], maxLength: 5000 }
        checklist:
          type: array
          minItems: 1
          maxItems: 100
          description: Only the items sent are changed; ids must be unique and belong to this report
          items: { $ref: "#/components/schemas/ChecklistItemUpdate" }

    ReportEditableValues:
      type: object
      description: Current values of the fields the client tried to change
      properties:
        painter_notes: { type: [string, "null"] }
        manager_notes: { type: [string, "null"] }
        checklist:
          type: array
          items:
            type: object
            required: [id, done, note]
            properties:
              id: { type: string, format: uuid }
              done: { type: boolean }
              note: { type: [string, "null"] }

    VersionConflictProblem:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [code, current_version, last_changed_at, last_changed_by, review_status, reviewed_at, reviewed_by]
          properties:
            code: { const: version_conflict }
            current_version: { type: integer, minimum: 1 }
            last_changed_at: { type: [string, "null"], format: date-time }
            last_changed_by:
              oneOf:
                - $ref: "#/components/schemas/PersonRef"
                - type: "null"
            review_status: { $ref: "#/components/schemas/ReviewStatus" }
            reviewed_at: { type: [string, "null"], format: date-time }
            reviewed_by:
              oneOf:
                - $ref: "#/components/schemas/PersonRef"
                - type: "null"
            current:
              $ref: "#/components/schemas/ReportEditableValues"
              description: PATCH only

    AlreadyReviewedProblem:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [code, current_version, reviewed_at, reviewed_by]
          properties:
            code: { const: already_reviewed }
            current_version: { type: integer, minimum: 1 }
            reviewed_at: { type: string, format: date-time }
            reviewed_by: { $ref: "#/components/schemas/PersonRef" }

    CustomerImpact:
      type: object
      description: How many records show this customer's details (computed when read)
      required: [job_count, report_count, reviewed_report_count, issued_invoice_count]
      properties:
        job_count: { type: integer, minimum: 0 }
        report_count: { type: integer, minimum: 0 }
        reviewed_report_count: { type: integer, minimum: 0, description: Stay reviewed after a customer edit }
        issued_invoice_count:
          type: integer
          minimum: 0
          description: Issued (not draft, not void) invoices; they show the current billing address (no snapshot yet)

    CustomerRecord:
      type: object
      required:
        - id
        - name
        - customer_type
        - contact_name
        - email
        - phone
        - billing_address
        - version
        - last_changed_at
        - last_changed_by
        - impact
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        customer_type: { $ref: "#/components/schemas/CustomerType" }
        contact_name: { type: [string, "null"] }
        email: { type: [string, "null"] }
        phone: { type: [string, "null"] }
        billing_address: { $ref: "#/components/schemas/Address" }
        version: { type: integer, minimum: 1, description: Starts at 1; +1 on every real change. Send it back on PATCH }
        last_changed_at: { type: [string, "null"], format: date-time, description: Null if never edited }
        last_changed_by:
          oneOf:
            - $ref: "#/components/schemas/PersonRef"
            - type: "null"
        impact: { $ref: "#/components/schemas/CustomerImpact" }

    AddressUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Only the parts sent are changed
      properties:
        line1: { type: string, minLength: 1, maxLength: 100 }
        line2: { type: [string, "null"], maxLength: 100 }
        town: { type: string, minLength: 1, maxLength: 60 }
        county: { type: [string, "null"], maxLength: 60 }
        postcode: { type: string, minLength: 5, maxLength: 10, examples: ["BS6 5QA"] }

    CustomerUpdate:
      type: object
      additionalProperties: false
      required: [version]
      minProperties: 2
      description: "`version` plus at least one editable field. Rules: `updateManagerCustomer`."
      properties:
        version: { type: integer, minimum: 1 }
        name: { type: string, minLength: 1, maxLength: 120 }
        contact_name: { type: [string, "null"], maxLength: 120 }
        email: { type: [string, "null"], maxLength: 254 }
        phone: { type: [string, "null"], maxLength: 30 }
        billing_address: { $ref: "#/components/schemas/AddressUpdate" }

    CustomerEditableValues:
      type: object
      description: Current values of the fields the client tried to change (billing address parts as sent)
      properties:
        name: { type: string }
        contact_name: { type: [string, "null"] }
        email: { type: [string, "null"] }
        phone: { type: [string, "null"] }
        billing_address:
          type: object
          properties:
            line1: { type: string }
            line2: { type: [string, "null"] }
            town: { type: string }
            county: { type: [string, "null"] }
            postcode: { type: string }

    CustomerVersionConflictProblem:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [code, current_version, last_changed_at, last_changed_by, current]
          properties:
            code: { const: version_conflict }
            current_version: { type: integer, minimum: 1 }
            last_changed_at: { type: [string, "null"], format: date-time }
            last_changed_by:
              oneOf:
                - $ref: "#/components/schemas/PersonRef"
                - type: "null"
            current: { $ref: "#/components/schemas/CustomerEditableValues" }

    AuditAction:
      type: string
      description: |
        `customer.edited` added by T-002n. T-003h: `report.submitted` (actor = the operative;
        no changes) and `report.photo_received` (a photo registered before submission arrived
        after it; actor = the operative; no changes).
      enum:
        - report.reviewed
        - report.reopened
        - report.edited
        - settings.changed
        - customer.edited
        - report.submitted
        - report.photo_received

    AuditField:
      type: string
      enum:
        - review_status
        - reviewed_by
        - reviewed_at
        - painter_notes
        - manager_notes
        - checklist_done
        - checklist_note
        - company_name
        - theme_primary
        - theme_accent
        - uk_only_contact_details
        - customer_name
        - customer_contact_name
        - customer_email
        - customer_phone
        - customer_billing_line1
        - customer_billing_line2
        - customer_billing_town
        - customer_billing_county
        - customer_billing_postcode

    AuditChange:
      type: object
      required: [field, item_id, item_label, old_value, new_value]
      properties:
        field: { $ref: "#/components/schemas/AuditField" }
        item_id: { type: [string, "null"], format: uuid, description: Checklist item for checklist_* fields }
        item_label: { type: [string, "null"], description: Checklist label at the time }
        old_value: { type: [string, boolean, "null"] }
        new_value: { type: [string, boolean, "null"] }

    AuditEvent:
      type: object
      required: [id, occurred_at, actor, action, changes]
      properties:
        id: { type: string, format: uuid }
        occurred_at: { type: string, format: date-time }
        actor:
          $ref: "#/components/schemas/PersonRef"
          description: Name as it was when the event happened
        action: { $ref: "#/components/schemas/AuditAction" }
        customer_id:
          type: [string, "null"]
          format: uuid
          x-ticket: T-002n
          description: Set for `customer.edited` events (the customer whose details changed), else null
        changes:
          type: array
          items: { $ref: "#/components/schemas/AuditChange" }

    AuditHistory:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          maxItems: 100
          description: Newest first
          items: { $ref: "#/components/schemas/AuditEvent" }
        total: { type: integer, minimum: 0, description: All events for the record (may exceed items) }

    # ---- T-003: operative app (design: specs/T-003-design.md) ----

    SemVer:
      type: string
      pattern: '^[0-9]{1,4}\.[0-9]{1,4}\.[0-9]{1,4}$'
      examples: ["1.0.0"]

    AppStatus:
      type: object
      required: [server_time, api_version, min_supported_versions]
      properties:
        server_time: { type: string, format: date-time, description: "Server clock, UTC, millisecond precision" }
        api_version: { type: string, examples: ["0.6.0"] }
        min_supported_versions:
          type: object
          required: [android]
          properties:
            android: { $ref: "#/components/schemas/SemVer" }

    DevicePlatform:
      type: string
      enum: [android, ios]

    DeviceSessionRequest:
      type: object
      additionalProperties: false
      required: [email, password, device_id, platform, app_version]
      properties:
        email: { type: string, minLength: 3, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 200 }
        device_id:
          type: string
          format: uuid
          description: Random UUID created by the app on first launch and kept in its secure store (not a hardware id)
        device_name:
          type: [string, "null"]
          maxLength: 60
          description: Shown to the office later, e.g. "Android 14". Free-text rule; no personal names
        platform: { $ref: "#/components/schemas/DevicePlatform" }
        app_version: { $ref: "#/components/schemas/SemVer" }

    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token: { type: string, minLength: 20, maxLength: 200 }

    DeviceSession:
      type: object
      required: [access_token, token_type, expires_in, refresh_token, refresh_expires_at, session_id, user]
      properties:
        access_token: { type: string }
        token_type: { type: string, const: bearer }
        expires_in: { type: integer, description: Seconds until the access token expires, examples: [900] }
        refresh_token: { type: string, description: "Opaque, single use; keep only in the secure store" }
        refresh_expires_at: { type: string, format: date-time, description: Informational; the server decides }
        session_id: { type: string, format: uuid }
        user: { $ref: "#/components/schemas/User" }

    OperativeJobStatus:
      type: string
      description: |
        The operative's view of a job: `to_do` (no report yet), `in_progress` (draft report),
        `submitted` (report submitted), `completed_by_office` (job completed with no operative
        report; not startable), `cancelled` (by the office).
      enum: [to_do, in_progress, submitted, completed_by_office, cancelled]

    ReportState:
      type: string
      enum: [draft, submitted]

    ChecklistStatus:
      type: string
      description: "`not_done` = \"Can't do this\"; the note is the reason (required at submit)."
      enum: [open, done, not_done]

    OperativeJobList:
      type: object
      required: [as_of, today, jobs_today, earlier_unfinished]
      properties:
        as_of: { type: string, format: date-time, description: Server time of the list }
        today: { type: string, format: date, description: The London calendar day used }
        jobs_today:
          type: array
          items: { $ref: "#/components/schemas/OperativeJob" }
        earlier_unfinished:
          type: array
          items: { $ref: "#/components/schemas/OperativeJob" }

    OperativeContact:
      type: object
      required: [name, phone]
      properties:
        name: { type: string, description: "The customer's contact name, else the customer name" }
        phone: { type: [string, "null"] }

    OperativeChecklistItem:
      type: object
      required: [id, position, label, status, note, removed]
      properties:
        id: { type: string, format: uuid, description: Stable item id (the same id as the manager's `ChecklistItem.id`) }
        position: { type: integer, minimum: 0 }
        label: { type: string }
        status: { $ref: "#/components/schemas/ChecklistStatus" }
        note: { type: [string, "null"], maxLength: 500 }
        removed:
          type: boolean
          description: Removed by the office after the operative recorded a status, note or photo on it; does not count for submission

    OperativeJob:
      type: object
      required:
        - id
        - reference
        - title
        - job_type
        - status
        - scheduled_start
        - site_address
        - checklist_total
        - checklist_dealt_with
        - notes
        - contact
        - checklist
        - report
      properties:
        id: { type: string, format: uuid }
        reference: { type: string, examples: ["JP-1061"] }
        title: { type: string, examples: ["Repaint lounge, hall and landing"] }
        job_type: { $ref: "#/components/schemas/JobType" }
        status: { $ref: "#/components/schemas/OperativeJobStatus" }
        scheduled_start: { type: string, format: date }
        site_address: { $ref: "#/components/schemas/Address" }
        checklist_total: { type: integer, minimum: 0, description: Items not removed }
        checklist_dealt_with: { type: integer, minimum: 0, description: "Items not removed that are done, or not done with a note (\"6 of 9 done\")" }
        notes:
          type: [string, "null"]
          x-ticket: T-003d
          description: Office/site notes (may be long)
        contact:
          x-ticket: T-003d
          description: Who to ring on site. Never email or billing details
          oneOf:
            - $ref: "#/components/schemas/OperativeContact"
            - type: "null"
        checklist:
          type: array
          x-ticket: T-003d
          description: By `position`; removed items (with operative data) last
          items: { $ref: "#/components/schemas/OperativeChecklistItem" }
        report:
          x-ticket: T-003d
          description: Null until the operative's first write creates the draft
          oneOf:
            - $ref: "#/components/schemas/OperativeReport"
            - type: "null"

    OperativeReport:
      type: object
      description: The operative's view of the report. Never contains `manager_notes`.
      required:
        - id
        - state
        - notes
        - submitted_at
        - submitted_by
        - review_status
        - reviewed_at
        - reviewed_by
        - submission_id
        - device_submitted_at
        - photos
        - sign_off
      properties:
        id: { type: string, format: uuid }
        state: { $ref: "#/components/schemas/ReportState" }
        notes: { type: [string, "null"], description: The operative's job notes (stored as the report's painter notes) }
        submitted_at: { type: [string, "null"], format: date-time }
        submitted_by:
          oneOf:
            - $ref: "#/components/schemas/PersonRef"
            - type: "null"
        review_status:
          description: Null while a draft
          oneOf:
            - $ref: "#/components/schemas/ReviewStatus"
            - type: "null"
        reviewed_at: { type: [string, "null"], format: date-time }
        reviewed_by:
          oneOf:
            - $ref: "#/components/schemas/PersonRef"
            - type: "null"
        submission_id:
          type: [string, "null"]
          format: uuid
          x-ticket: T-003h
          description: The accepted submission; the app compares it with its own to tell "my submit" from "another device's"
        device_submitted_at:
          type: [string, "null"]
          format: date-time
          x-ticket: T-003h
        photos:
          type: array
          x-ticket: T-003g
          description: Every registered photo, ordered by stage then `taken_at`
          items: { $ref: "#/components/schemas/OperativePhoto" }
        sign_off:
          x-ticket: T-003o
          oneOf:
            - $ref: "#/components/schemas/SignOff"
            - type: "null"

    DraftChecklistUpdate:
      type: object
      additionalProperties: false
      required: [item_id]
      minProperties: 2
      properties:
        item_id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/ChecklistStatus" }
        note: { type: [string, "null"], maxLength: 500, description: Empty or whitespace-only is stored as null }

    DraftUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        notes: { type: [string, "null"], maxLength: 2000, description: Empty or whitespace-only is stored as null }
        checklist:
          type: array
          minItems: 1
          maxItems: 200
          description: Item ids must be unique and belong to the job
          items: { $ref: "#/components/schemas/DraftChecklistUpdate" }
        sign_off:
          x-ticket: T-003o
          description: Null clears it
          oneOf:
            - $ref: "#/components/schemas/SignOff"
            - type: "null"

    SubmitRequest:
      type: object
      additionalProperties: false
      required: [submission_id, device_submitted_at, device_sent_at, photo_ids]
      properties:
        submission_id: { type: string, format: uuid, description: Created on the phone when the operative confirms Submit; reused for every retry }
        device_submitted_at: { type: string, format: date-time, description: Phone time when Submit was confirmed }
        device_sent_at: { type: string, format: date-time, description: Phone time when this request was sent (for the clock offset) }
        photo_ids:
          type: array
          maxItems: 60
          uniqueItems: true
          description: Every photo the phone holds for this report (sent or not), excluding ones it deleted
          items: { type: string, format: uuid }
        draft: { $ref: "#/components/schemas/DraftUpdate" }

    AlreadySubmittedProblem:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [code, submitted_at]
          properties:
            code: { const: already_submitted }
            submitted_at: { type: string, format: date-time }

    PhotosNotRegisteredProblem:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [code, missing_photo_ids]
          properties:
            code: { const: photos_not_registered }
            missing_photo_ids:
              type: array
              items: { type: string, format: uuid }

    PhotoSource:
      type: string
      enum: [camera, gallery]

    TakenAtSource:
      type: string
      description: "`device_clock` (in-app camera), `file_metadata` (gallery photo's own date), `added_time` (gallery photo with no readable date: the time it was added)"
      enum: [device_clock, file_metadata, added_time]

    PhotoLocation:
      type: object
      additionalProperties: false
      required: [latitude, longitude, accuracy_m, source]
      properties:
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        accuracy_m: { type: [number, "null"], minimum: 0, maximum: 100000 }
        source:
          type: string
          enum: [device, file]
          description: "`device` = the phone's position when the photo was taken; `file` = read from a gallery photo's metadata"

    PhotoFileFacts:
      type: object
      additionalProperties: false
      required: [width, height, bytes, sha256]
      properties:
        width: { type: integer, minimum: 1, maximum: 20000 }
        height: { type: integer, minimum: 1, maximum: 20000 }
        bytes: { type: integer, minimum: 1 }
        sha256: { type: string, pattern: "^[0-9a-f]{64}$" }

    UploadFileFacts:
      type: object
      additionalProperties: false
      required: [width, height, bytes, sha256, content_type]
      properties:
        width: { type: integer, minimum: 1, maximum: 4096 }
        height: { type: integer, minimum: 1, maximum: 4096 }
        bytes: { type: integer, minimum: 1, maximum: 10485760 }
        sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        content_type: { type: string, enum: [image/jpeg, image/png] }

    PhotoRegistration:
      type: object
      additionalProperties: false
      description: |
        A full representation (PUT): an omitted `checklist_item_id` means none, an omitted
        `caption` means "". Evidence fields (`source`, `taken_at`, `taken_at_source`,
        `location`, `original`, `upload`) can never change after the first registration.
      required: [stage, source, taken_at, taken_at_source, device_sent_at, original, upload]
      properties:
        stage: { $ref: "#/components/schemas/PhotoStage" }
        checklist_item_id: { type: [string, "null"], format: uuid, description: A checklist item of this job }
        caption: { type: string, maxLength: 140, description: Single-line free-text rule; trimmed }
        source: { $ref: "#/components/schemas/PhotoSource" }
        taken_at: { type: string, format: date-time }
        taken_at_source: { $ref: "#/components/schemas/TakenAtSource" }
        device_sent_at: { type: string, format: date-time, description: Phone time when this request was sent }
        location:
          x-ticket: T-003k
          oneOf:
            - $ref: "#/components/schemas/PhotoLocation"
            - type: "null"
        original:
          $ref: "#/components/schemas/PhotoFileFacts"
          description: The full-size file kept on the phone (not uploaded); its fingerprint is evidence
        upload:
          $ref: "#/components/schemas/UploadFileFacts"
          description: The resized copy that step 2 uploads (long edge at most 2560 px on the app's side)

    OperativePhoto:
      type: object
      required: [id, stage, checklist_item_id, caption, source, taken_at, taken_at_source, registered_at, received_at, clock_offset_seconds, thumb_url]
      properties:
        id: { type: string, format: uuid }
        stage: { $ref: "#/components/schemas/PhotoStage" }
        checklist_item_id: { type: [string, "null"], format: uuid }
        caption: { type: string }
        source: { $ref: "#/components/schemas/PhotoSource" }
        taken_at: { type: string, format: date-time }
        taken_at_source: { $ref: "#/components/schemas/TakenAtSource" }
        registered_at: { type: string, format: date-time }
        received_at: { type: [string, "null"], format: date-time, description: Null until the file has arrived ("Sent" means not null) }
        clock_offset_seconds: { type: [integer, "null"] }
        thumb_url: { type: [string, "null"], format: uri, description: "Short-lived thumbnail URL once received; the app downloads only its own thumbnails" }

    SignOffOutcome:
      type: string
      enum: [present_happy, present_concerns, not_present]

    SignOff:
      type: object
      additionalProperties: false
      required: [outcome, customer_name, note, recorded_at]
      description: |
        Not a signature. `customer_name` is required (non-blank) for the two "present"
        outcomes and must be null for `not_present`. Single-line rule for the name, multi-line
        rule for the note.
      properties:
        outcome: { $ref: "#/components/schemas/SignOffOutcome" }
        customer_name: { type: [string, "null"], maxLength: 120 }
        note: { type: [string, "null"], maxLength: 500 }
        recorded_at: { type: string, format: date-time, description: Phone time it was recorded }
