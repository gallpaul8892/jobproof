server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Security headers (including the CSP built from API_BASE_URL) are written at container
    # start by docker-entrypoint.d/40-jobproof-config.sh. add_header is not inherited into
    # locations that set their own add_header, so the file is included in each location.

    location = /index.html {
        include /tmp/jobproof-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location = /config.js {
        include /tmp/jobproof-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location /assets/ {
        include /tmp/jobproof-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        include /tmp/jobproof-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
